<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Property Comp Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif;
        }
        #map { 
            height: 100vh; 
            width: 100%; 
        }
        .leaflet-popup-content {
            margin: 10px;
            line-height: 1.4;
        }
        .leaflet-popup-content h3 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .comp-popup {
            font-size: 13px;
            max-width: 300px;
        }
        .comp-popup p {
            margin: 5px 0;
        }
        .comp-popup strong {
            color: #555;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Get URL parameters
        const params = new URLSearchParams(window.location.search);
        
        // Initialize map centered on subject property
        const map = L.map('map').setView([
            parseFloat(params.get('subjectLat')), 
            parseFloat(params.get('subjectLng'))
        ], 14);
        
        // Add CartoDB Positron tiles (Google Maps style - clean and minimal)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);
        
        // Custom red icon for subject property
        const redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });
        
        // Custom blue icon for comps
        const blueIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });
        
        // Add subject property marker (RED)
        const subjectAddress = params.get('subjectAddress') || 'Subject Property';
        const subjectPrice = params.get('subjectPrice') || 'N/A';
        
        L.marker([
            parseFloat(params.get('subjectLat')), 
            parseFloat(params.get('subjectLng'))
        ], {icon: redIcon})
            .addTo(map)
            .bindPopup(`
                <div class="comp-popup">
                    <h3 style="color: #d63031;">📍 Subject Property</h3>
                    <p><strong>Address:</strong> ${subjectAddress}</p>
                    <p><strong>Asking Price:</strong> $${parseFloat(subjectPrice).toLocaleString()}</p>
                </div>
            `)
            .openPopup(); // Auto-open subject property popup
        
        // Add comp markers (BLUE)
        const compsData = params.get('comps');
        if (compsData) {
            try {
                const comps = JSON.parse(decodeURIComponent(compsData));
                
                comps.forEach((comp, index) => {
                    if (comp.lat && comp.lng) {
                        L.marker([comp.lat, comp.lng], {icon: blueIcon})
                            .addTo(map)
                            .bindPopup(`
                                <div class="comp-popup">
                                    <h3 style="color: #0984e3;">Comp ${index + 1}</h3>
                                    <p><strong>${comp.address || 'N/A'}</strong></p>
                                    <p><strong>Sold Price:</strong> $${parseInt(comp.price).toLocaleString()} ${comp.closeDate ? '(' + comp.closeDate + ')' : ''}</p>
                                    <p><strong>MLS#:</strong> ${comp.mls || 'N/A'}</p>
                                    <p><strong>Size:</strong> ${comp.sqft || 'N/A'} sqft ${comp.pricePerSqft ? '($' + comp.pricePerSqft + '/sqft)' : ''}</p>
                                    <p><strong>Built:</strong> ${comp.yearBuilt || 'N/A'}</p>
                                    <p><strong>Beds/Baths:</strong> ${comp.beds || 'N/A'} beds, ${comp.baths || 'N/A'} baths</p>
                                    <p><strong>Distance:</strong> ${comp.distance || 'N/A'} mi away</p>
                                    <p><strong>Legal Sub:</strong> ${comp.subdivision || 'N/A'}</p>
                                    <p><strong>Garage:</strong> ${comp.garage || 'N/A'}</p>
                                </div>
                            `);
                    }
                });
                
                // Auto-fit map to show all markers
                const bounds = L.latLngBounds([
                    [parseFloat(params.get('subjectLat')), parseFloat(params.get('subjectLng'))]
                ]);
                comps.forEach(comp => {
                    if (comp.lat && comp.lng) {
                        bounds.extend([comp.lat, comp.lng]);
                    }
                });
                map.fitBounds(bounds, { padding: [50, 50] });
                
            } catch (error) {
                console.error('Error parsing comps data:', error);
            }
        }
    </script>
</body>
</html>
