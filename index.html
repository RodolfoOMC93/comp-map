<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Property Comp Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        #map { 
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%; 
        }
        .mapboxgl-popup-content {
            padding: 15px;
            border-radius: 8px;
        }
        .comp-popup h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            font-weight: 600;
        }
        .comp-popup p {
            margin: 5px 0;
            font-size: 13px;
            line-height: 1.5;
        }
        .comp-popup strong {
            color: #555;
            font-weight: 600;
        }
        /* Custom marker styles */
        .custom-marker {
            width: 32px;
            height: 32px;
            border-radius: 50% 50% 50% 0;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .marker-red {
            background: #EA4335;
        }
        .marker-blue {
            background: #4285F4;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Get URL parameters
        const params = new URLSearchParams(window.location.search);
        
        mapboxgl.accessToken = '__MAPBOX_TOKEN__';
        
        const subjectLat = parseFloat(params.get('subjectLat'));
        const subjectLng = parseFloat(params.get('subjectLng'));
        
        // Initialize map with Streets v12 - pure Mapbox style, no modifications
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [subjectLng, subjectLat],
            zoom: 13
        });
        
        // Add navigation controls
        map.addControl(new mapboxgl.NavigationControl());
        
        map.on('load', () => {
            // Add subject property marker (RED)
            const subjectAddress = params.get('subjectAddress') || 'Subject Property';
            const subjectPrice = params.get('subjectPrice') || 'N/A';
            
            const subjectEl = document.createElement('div');
            subjectEl.className = 'custom-marker marker-red';
            
            new mapboxgl.Marker({element: subjectEl, anchor: 'bottom'})
                .setLngLat([subjectLng, subjectLat])
                .setPopup(new mapboxgl.Popup({offset: 25})
                    .setHTML(`
                        <div class="comp-popup">
                            <h3 style="color: #EA4335;">📍 Subject Property</h3>
                            <p><strong>Address:</strong> ${subjectAddress}</p>
                            <p><strong>Asking Price:</strong> $${parseFloat(subjectPrice).toLocaleString()}</p>
                        </div>
                    `))
                .addTo(map)
                .togglePopup();
            
            // Add comp markers (BLUE)
            const compsData = params.get('comps');
            if (compsData) {
                try {
                    const comps = JSON.parse(decodeURIComponent(compsData));
                    const bounds = new mapboxgl.LngLatBounds();
                    
                    // Add subject to bounds
                    bounds.extend([subjectLng, subjectLat]);
                    
                    comps.forEach((comp, index) => {
                        if (comp.lat && comp.lng) {
                            // Create numbered blue marker
                            const compEl = document.createElement('div');
                            compEl.className = 'custom-marker marker-blue';
                            compEl.textContent = index + 1;
                            
                            new mapboxgl.Marker({element: compEl, anchor: 'bottom'})
                                .setLngLat([comp.lng, comp.lat])
                                .setPopup(new mapboxgl.Popup({offset: 25})
                                    .setHTML(`
                                        <div class="comp-popup">
                                            <h3 style="color: #4285F4;">Comp ${index + 1}</h3>
                                            <p><strong>${comp.address || 'N/A'}</strong></p>
                                            <p><strong>Sold Price:</strong> $${parseInt(comp.price).toLocaleString()} ${comp.closeDate ? '(' + comp.closeDate + ')' : ''}</p>
                                            <p><strong>MLS#:</strong> ${comp.mls || 'N/A'}</p>
                                            <p><strong>Size:</strong> ${comp.sqft || 'N/A'} sqft ${comp.pricePerSqft ? '($' + comp.pricePerSqft + '/sqft)' : ''}</p>
                                            <p><strong>Built:</strong> ${comp.yearBuilt || 'N/A'}</p>
                                            <p><strong>Beds/Baths:</strong> ${comp.beds || 'N/A'} beds, ${comp.baths || 'N/A'} baths</p>
                                            <p><strong>Distance:</strong> ${comp.distance || 'N/A'} mi away</p>
                                            <p><strong>Legal Sub:</strong> ${comp.subdivision || 'N/A'}</p>
                                            <p><strong>Garage:</strong> ${comp.garage || 'N/A'}</p>
                                        </div>
                                    `))
                                .addTo(map);
                            
                            // Add to bounds
                            bounds.extend([comp.lng, comp.lat]);
                        }
                    });
                    
                    // Fit map to show all markers
                    map.fitBounds(bounds, { padding: 50 });
                    
                } catch (error) {
                    console.error('Error parsing comps data:', error);
                }
            }
        });
    </script>
</body>
</html>
